{% load static %}

<nav class="navbar" role="navigation" aria-label="Main navigation" style="position: relative; padding: 0 24px; height: 72px; display: flex; align-items: center;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0;">

        <!-- Logo -->
        <a href="{% url 'website:index' %}" class="navbar-brand" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
            <img src="{% static 'images/logo.png' %}" alt="{{ SITE_NAME }}" id="main-logo" style="height: 48px; width: auto; transition: all 0.3s ease;">
            <span style="font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--text-primary); display: none; letter-spacing: -0.01em;">{{ SITE_NAME }}</span>
        </a>

        <!-- Navbar Toggle (Mobile) -->
        <button id="navbarToggle" class="navbar-toggle" aria-expanded="false" style="display: none; background: none; border: none; font-size: 1.4rem; color: var(--text-primary); cursor: pointer; padding: 8px;">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Navbar Menu -->
        <ul id="navbarMenu" class="navbar-menu" style="display: flex; align-items: center; gap: 4px; list-style: none; margin: 0; padding: 0;">
            <li><a href="{% url 'website:index' %}" class="nav-link" style="padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">Home</a></li>
            <li><a href="{% url 'website:about' %}" class="nav-link" style="padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">About</a></li>
            <li><a href="{% url 'website:services' %}" class="nav-link" style="padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">Services</a></li>
            <li><a href="{% url 'website:projects' %}" class="nav-link" style="padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">Projects</a></li>
            <li><a href="{% url 'website:blog' %}" class="nav-link" style="padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">Blog</a></li>
            <li class="nav-dropdown" style="position: relative;">
                <a href="{% url 'shop:index' %}" class="nav-link nav-dropdown-trigger"
                   aria-haspopup="true"
                   aria-expanded="false"
                   style="display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">
                    Shop
                    <i class="fas fa-chevron-down nav-dropdown-caret" style="font-size: 0.7rem; opacity: 0.7; transition: transform 0.2s ease;"></i>
                </a>
                <ul class="nav-dropdown-menu" role="menu"
                    style="position: absolute; top: calc(100% + 8px); right: 0; min-width: 240px; padding: 8px; margin: 0; list-style: none; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 12px; box-shadow: 0 12px 32px -8px rgba(13, 43, 54, 0.18); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s; z-index: 100;">
                    <li role="none">
                        <a role="menuitem" href="{% url 'shop:section_products' 'CONSTRUCTION' %}"
                           class="nav-dropdown-item"
                           style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text-primary); text-decoration: none; font-size: 0.92rem; font-weight: 500; transition: background 0.2s ease, color 0.2s ease;">
                            <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(11, 102, 195, 0.12); color: #0B66C3; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <i class="fas fa-hard-hat"></i>
                            </span>
                            <span style="flex: 1;">
                                <span style="display: block; font-weight: 600;">Construction Shop</span>
                                <span style="display: block; font-size: 0.75rem; color: var(--text-tertiary); font-weight: 500;">Cement, steel, sand, paint…</span>
                            </span>
                        </a>
                    </li>
                    <li role="none">
                        <a role="menuitem" href="{% url 'shop:section_products' 'GENERAL_STORE' %}"
                           class="nav-dropdown-item"
                           style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text-primary); text-decoration: none; font-size: 0.92rem; font-weight: 500; transition: background 0.2s ease, color 0.2s ease;">
                            <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(39, 174, 96, 0.12); color: #27AE60; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <i class="fas fa-store"></i>
                            </span>
                            <span style="flex: 1;">
                                <span style="display: block; font-weight: 600;">General Store</span>
                                <span style="display: block; font-size: 0.75rem; color: var(--text-tertiary); font-weight: 500;">Stationery, snacks, household…</span>
                            </span>
                        </a>
                    </li>
                    <li role="none" style="border-top: 1px solid var(--border-primary); margin-top: 6px; padding-top: 6px;">
                        <a role="menuitem" href="{% url 'shop:index' %}"
                           class="nav-dropdown-item"
                           style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text-primary); text-decoration: none; font-size: 0.92rem; font-weight: 500; transition: background 0.2s ease, color 0.2s ease;">
                            <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(212, 175, 55, 0.14); color: #D4AF37; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <i class="fas fa-th-large"></i>
                            </span>
                            <span style="flex: 1;">
                                <span style="display: block; font-weight: 600;">All Products</span>
                                <span style="display: block; font-size: 0.75rem; color: var(--text-tertiary); font-weight: 500;">Browse the whole shop</span>
                            </span>
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <a href="{% url 'shop:cart_view' %}" aria-label="View cart" id="globalCartLink" style="position: relative; display: inline-flex; align-items: center; justify-content: center; padding: 9px 12px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-size: 1.05rem; transition: all 0.25s ease;">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="globalCartBadge" class="cart-badge {% if not cart_count %}empty{% endif %}" style="position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-secondary); color: #0D2B36; font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; line-height: 1;">{{ cart_count|default:0 }}</span>
                </a>
            </li>
            <li><a href="{% url 'website:contact' %}" class="nav-link" style="padding: 9px 16px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s ease; font-family: 'Montserrat', sans-serif;">Contact</a></li>
            <li><a href="{% url 'website:quote_request' %}" class="btn btn-gold btn-sm" style="margin-left: 6px; font-family: 'Montserrat', sans-serif;">
                <i class="fas fa-paper-plane"></i> Get a Quote
            </a></li>

            <!-- Simple Theme Toggle -->
            <li>
                <button id="themeToggle" aria-label="Toggle theme" style="background: none; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; padding: 9px 14px; border-radius: var(--radius-md); transition: all 0.25s ease; display: flex; align-items: center; font-family: 'Montserrat', sans-serif;">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </li>
        </ul>

    </div>
</nav>

<style>
    #themeToggle:hover {
        background: var(--bg-secondary);
        color: var(--accent-secondary);
    }
    #themeToggle:active {
        transform: scale(0.9);
    }

    .nav-link:hover {
        color: var(--accent-secondary) !important;
        background: var(--bg-secondary);
    }
    .nav-link.active {
        color: var(--accent-primary) !important;
        font-weight: 600;
    }

    /* Global cart icon in main navbar */
    #globalCartLink:hover {
        color: var(--accent-secondary);
        background: var(--bg-secondary);
    }
    #globalCartLink:hover .cart-badge:not(.empty) {
        transform: scale(1.08);
    }
    #globalCartBadge {
        transition: transform 0.2s ease;
    }
    #globalCartBadge.empty {
        display: none;
    }

    /* ── Shop dropdown ───────────────────────────────────────────── */
    .nav-dropdown:hover > .nav-dropdown-menu,
    .nav-dropdown:focus-within > .nav-dropdown-menu,
    .nav-dropdown.is-open > .nav-dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    .nav-dropdown:hover > .nav-dropdown-trigger .nav-dropdown-caret,
    .nav-dropdown:focus-within > .nav-dropdown-trigger .nav-dropdown-caret,
    .nav-dropdown.is-open > .nav-dropdown-trigger .nav-dropdown-caret {
        transform: rotate(180deg);
    }
    .nav-dropdown-item:hover,
    .nav-dropdown-item:focus-visible {
        background: var(--bg-secondary);
        color: var(--accent-primary) !important;
    }
    .nav-dropdown-item:hover span[style*="color: #0B66C3"],
    .nav-dropdown-item:hover span[style*="color: #27AE60"],
    .nav-dropdown-item:hover span[style*="color: #D4AF37"] {
        /* keep icon coloured on hover */
    }
    @media (max-width: 992px) {
        .nav-dropdown { width: 100%; }
        .nav-dropdown > .nav-dropdown-trigger {
            width: 100%;
            justify-content: space-between;
            padding: 12px 16px !important;
        }
        .nav-dropdown > .nav-dropdown-menu {
            position: static !important;
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
            box-shadow: none !important;
            border: none !important;
            background: transparent !important;
            padding-left: 16px !important;
            min-width: 0 !important;
            margin-top: 4px;
            display: none;
        }
        .nav-dropdown.is-open > .nav-dropdown-menu { display: block; }
        .nav-dropdown-item {
            padding: 14px 12px !important;
        }
        .nav-dropdown-item span[style*="width: 32px"] {
            width: 36px !important;
            height: 36px !important;
        }
    }

    /* Mobile Styles */
    @media (max-width: 992px) {
        .navbar-toggle { display: block !important; }
        .navbar-menu {
            display: none !important;
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            background: var(--bg-card);
            flex-direction: column;
            padding: 16px 24px;
            box-shadow: var(--shadow-lg);
            border-bottom: 1px solid var(--border-primary);
            gap: 4px !important;
            max-height: calc(100vh - 72px);
            overflow-y: auto;
        }
        .navbar-menu.active { display: flex !important; }
        .navbar-menu li { width: 100%; }
        .navbar-menu li a { display: block; padding: 12px 16px !important; width: 100%; }
        .navbar-menu .btn-gold { text-align: center; margin-left: 0 !important; margin-top: 8px; }
        #themeToggle {
            padding: 12px 16px !important;
            width: 100%;
            justify-content: center;
        }
    }

    @media (max-width: 480px) {
        .navbar { padding: 0 16px !important; }
        .navbar-brand img { height: 40px !important; }
        .navbar-menu .btn-gold { width: 100%; justify-content: center; }
    }
</style>

<script>
(function () {
    "use strict";
    // The Shop trigger should TOGGLE the dropdown everywhere — hover
    // opens it on desktop via CSS, but click must also toggle instead
    // of navigating away (otherwise touch users never see the menu).
    // The "All Products" item inside the dropdown is the actual link to
    // /shop/, so navigating from the trigger is redundant.
    function initShopDropdown() {
        var trigger = document.querySelector(".nav-dropdown-trigger");
        var dropdown = trigger && trigger.closest(".nav-dropdown");
        if (!trigger || !dropdown) { return; }

        // Prevent the trigger from navigating away — the dropdown items
        // below it carry the real URLs.
        trigger.addEventListener("click", function (e) {
            e.preventDefault();
            dropdown.classList.toggle("is-open");
            var expanded = dropdown.classList.contains("is-open");
            trigger.setAttribute("aria-expanded", expanded ? "true" : "false");
        });

        // Close on outside click / Escape.
        document.addEventListener("click", function (e) {
            if (!dropdown.contains(e.target)) {
                dropdown.classList.remove("is-open");
                trigger.setAttribute("aria-expanded", "false");
            }
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                dropdown.classList.remove("is-open");
                trigger.setAttribute("aria-expanded", "false");
            }
        });
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initShopDropdown);
    } else {
        initShopDropdown();
    }
})();
</script>
