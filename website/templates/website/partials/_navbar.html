{% load static %}

<nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container navbar-container">

        <!-- Logo -->
        <a href="{% url 'website:index' %}" class="navbar-brand">
            <img src="{% static 'images/logo.png' %}" alt="Caldan Construction and Consultancy Firm" id="main-logo">
            <span class="brand-text">Caldan Construction</span>
        </a>

        <!-- Navbar Toggle (Mobile) -->
        <button id="navbarToggle" class="navbar-toggle" aria-expanded="false" aria-label="Toggle navigation menu">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Navbar Menu -->
        <ul id="navbarMenu" class="navbar-menu">
            <li class="nav-item">
                <a href="{% url 'website:index' %}" class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">Home</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'website:about' %}" class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'website:services' %}" class="nav-link {% if request.resolver_match.url_name == 'services' %}active{% endif %}">Services</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'website:projects' %}" class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}">Projects</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'website:blog' %}" class="nav-link {% if request.resolver_match.url_name == 'blog' %}active{% endif %}">Blog</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'compassion:index' %}" class="nav-link {% if request.resolver_match.url_name == 'index' and request.resolver_match.namespace == 'compassion' %}active{% endif %}">Compassion</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'shop:index' %}" class="nav-link {% if request.resolver_match.namespace == 'shop' %}active{% endif %}">Shop</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'shop:cart_view' %}" aria-label="View cart" id="globalCartLink">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="globalCartBadge" class="cart-badge {% if not cart_count %}empty{% endif %}">{{ cart_count|default:0 }}</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'website:contact' %}" class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'website:quote_request' %}" class="btn btn-gold btn-sm">Get a Quote</a>
            </li>
            <li class="nav-item">
                <button id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </li>
        </ul>
    </div>
</nav>

<style>
    .navbar {
        position: relative;
        padding: 0 24px;
        height: 72px;
        display: flex;
        align-items: center;
        z-index: 1000;
    }
    .navbar-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 0;
    }
    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        z-index: 1100;
    }
    #main-logo {
        height: 48px;
        width: auto;
        transition: all 0.3s ease;
    }
    .brand-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--text-primary);
        display: none;
        letter-spacing: -0.01em;
    }
    .navbar-menu {
        display: flex;
        align-items: center;
        gap: 4px;
        list-style: none;
        margin: 0;
        padding: 0;
    }
    .nav-item {
        display: flex;
        align-items: center;
    }
    .nav-link {
        padding: 9px 16px;
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.25s ease;
        font-family: 'Montserrat', sans-serif;
    }
    .nav-link:hover {
        color: var(--accent-secondary) !important;
        background: var(--bg-secondary);
    }
    .nav-link.active {
        color: var(--accent-primary) !important;
        font-weight: 600;
    }
    #globalCartLink {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 12px;
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 1.05rem;
        transition: all 0.25s ease;
    }
    #globalCartLink:hover {
        color: var(--accent-secondary);
        background: var(--bg-secondary);
    }
    .cart-badge {
        position: absolute;
        top: 2px;
        right: 0;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--accent-secondary);
        color: #0D2B36;
        font-size: 0.65rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
    }
    .cart-badge.empty {
        display: none;
    }
    #themeToggle {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 9px 14px;
        border-radius: var(--radius-md);
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
    }
    #themeToggle:hover {
        background: var(--bg-secondary);
        color: var(--accent-secondary);
    }

    /* DEFAULT: Hide toggle on desktop */
    .navbar-toggle {
        display: none;
    }

    @media (max-width: 992px) {
        .navbar-toggle {
            display: flex !important;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-primary);
            z-index: 1100;
            font-size: 1.2rem;
        }
        .navbar-menu {
            display: none;
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            background: var(--bg-card);
            flex-direction: column;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            border-bottom: 1px solid var(--border-primary);
            gap: 12px !important;
            max-height: calc(100vh - 72px);
            overflow-y: auto;
            z-index: 1000;
        }
        .navbar-menu.active {
            display: flex !important;
        }
        .nav-item {
            width: 100%;
        }
        .nav-link, #globalCartLink, #themeToggle {
            display: flex !important;
            padding: 12px 16px !important;
            width: 100%;
            text-align: center;
            justify-content: center;
        }
        .navbar-menu .btn-gold {
            text-align: center;
            margin-left: 0 !important;
            margin-top: 8px;
            width: 100%;
            justify-content: center;
        }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var toggleBtn = document.getElementById('navbarToggle');
    var menu = document.getElementById('navbarMenu');

    if (toggleBtn && menu) {
        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            var isOpen = menu.classList.toggle('active');
            this.setAttribute('aria-expanded', isOpen);
        });

        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 992 && menu.classList.contains('active')) {
                if (!menu.contains(e.target) && !toggleBtn.contains(e.target)) {
                    menu.classList.remove('active');
                    toggleBtn.setAttribute('aria-expanded', 'false');
                }
            }
        });

        menu.querySelectorAll('a, button').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 992) {
                    menu.classList.remove('active');
                    toggleBtn.setAttribute('aria-expanded', 'false');
                }
            });
        });
    }
});
</script>
