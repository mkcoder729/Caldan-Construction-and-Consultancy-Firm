<section class="stats-bar" style="padding: 72px 0; background: var(--bg-primary);">
    <div class="container">

        <div class="section-head" style="text-align: center; margin-bottom: 48px;">
            <p class="eyebrow" style="color: var(--accent-secondary); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;">
                <i class="fas fa-chart-bar" style="margin-right: 8px;"></i> By the numbers
            </p>
            <h2 style="font-size: clamp(1.6rem, 2.5vw, 2.2rem); font-weight: 700; color: var(--text-primary);">Caldan in numbers</h2>
        </div>

        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; text-align: center;">

            <!-- Years Experience (Auto-calculated from 2008) -->
            <div class="stat-item" style="padding: 20px 16px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-primary); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);">
                <div style="width: 48px; height: 48px; margin: 0 auto 12px; background: rgba(212, 175, 55, 0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-calendar-alt" style="color: var(--accent-secondary); font-size: 1.2rem;"></i>
                </div>
                <div style="font-size: 2.4rem; font-weight: 700; color: var(--accent-secondary); letter-spacing: -0.02em; font-family: var(--font-display);">
                    {{ years_experience }}+
                </div>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 4px 0 0; font-weight: 500;">Years Experience</p>
            </div>

            <!-- Projects Completed (Dynamic from database) -->
            <div class="stat-item" style="padding: 20px 16px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-primary); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);">
                <div style="width: 48px; height: 48px; margin: 0 auto 12px; background: rgba(39, 174, 96, 0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-check-circle" style="color: #27AE60; font-size: 1.2rem;"></i>
                </div>
                <div style="font-size: 2.4rem; font-weight: 700; color: var(--accent-secondary); letter-spacing: -0.02em; font-family: var(--font-display);">{{ completed_projects|default:"0" }}+</div>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 4px 0 0; font-weight: 500;">Projects Completed</p>
            </div>

            <!-- Active Projects (Dynamic from database) -->
            <div class="stat-item" style="padding: 20px 16px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-primary); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);">
                <div style="width: 48px; height: 48px; margin: 0 auto 12px; background: rgba(11, 102, 195, 0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-spinner" style="color: #0B66C3; font-size: 1.2rem;"></i>
                </div>
                <div style="font-size: 2.4rem; font-weight: 700; color: var(--accent-secondary); letter-spacing: -0.02em; font-family: var(--font-display);">{{ active_projects|default:"0" }}</div>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 4px 0 0; font-weight: 500;">Active Projects</p>
            </div>

            <!-- Client Satisfaction (Static 100%) -->
            <div class="stat-item" style="padding: 20px 16px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-primary); transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);">
                <div style="width: 48px; height: 48px; margin: 0 auto 12px; background: rgba(212, 175, 55, 0.10); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-star" style="color: #D4AF37; font-size: 1.2rem;"></i>
                </div>
                <div style="font-size: 2.4rem; font-weight: 700; color: var(--accent-secondary); letter-spacing: -0.02em; font-family: var(--font-display);">100%</div>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin: 4px 0 0; font-weight: 500;">Client Satisfaction</p>
            </div>

        </div>

    </div>
</section>

<style>
    .stat-item {
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .stat-item:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
        border-color: var(--accent-secondary) !important;
    }
    .stat-item:hover .stat-icon {
        transform: scale(1.05);
    }

    @media (max-width: 768px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 16px !important; }
        .stat-item div:first-child { font-size: 2rem !important; }
        .stat-item { padding: 16px !important; }
    }
    @media (max-width: 480px) {
        .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
        .stat-item { padding: 14px !important; }
        .stat-item div:first-child { font-size: 1.6rem !important; }
    }
</style>
