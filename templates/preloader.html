{% load static %}

<div id="preloader">

    <!-- Floating Particles -->
    <div class="preloader-particles">
        <div class="particle"><i class="fas fa-hard-hat"></i></div>
        <div class="particle"><i class="fas fa-tools"></i></div>
        <div class="particle"><i class="fas fa-drafting-compass"></i></div>
        <div class="particle"><i class="fas fa-building"></i></div>
        <div class="particle"><i class="fas fa-cubes"></i></div>
        <div class="particle"><i class="fas fa-wrench"></i></div>
        <div class="particle"><i class="fas fa-ruler-combined"></i></div>
        <div class="particle"><i class="fas fa-helmet-safety"></i></div>
    </div>

    <div class="loader-container">
        <!-- Hard Hat Icon -->
        <div class="construction-icon">
            <i class="fas fa-hard-hat"></i>
        </div>

        <!-- Spinning Gears -->
        <div class="construction-loader">
            <div class="gear"></div>
            <div class="gear"></div>
            <div class="gear"></div>
        </div>

        <!-- Text -->
        <div class="loader-text" id="loaderStatus">Loading</div>
        <div class="loader-subtext" id="loaderSubStatus">Building Your Experience</div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-text">
                <span id="loaderProgressText">0%</span>
                <span id="loaderSubStatus2">Almost There</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Loading Dots -->
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</div>
