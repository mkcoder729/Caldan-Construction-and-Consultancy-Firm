{% extends "dashboard/base_dashboard.html" %}
{% load static %}

{% block title %}Ministry Settings — Caldan Dashboard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/compassion_dashboard.css' %}">
{% endblock %}

{% block dashboard_content %}
<div class="compassion-dashboard">

    <div class="page-header">
        <div class="page-header__main">
            <div class="page-header__icon"><i class="fas fa-sliders"></i></div>
            <div>
                <h1 class="page-header__title">Ministry Settings</h1>
                <p class="page-header__sub">Public-facing copy for /compassion/</p>
            </div>
        </div>
    </div>

    <div class="form-panel">
        <form method="post">
            {% csrf_token %}
            <div class="form-grid">
                <div class="col-span-8">
                    <label class="form-label">Hero title</label>
                    <input name="hero_title" class="form-control" value="{{ settings.hero_title }}">
                </div>
                <div class="col-span-4">
                    <label class="form-label">CTA label</label>
                    <input name="hero_cta_label" class="form-control" value="{{ settings.hero_cta_label }}">
                </div>
                <div class="col-span-12">
                    <label class="form-label">Hero subtitle</label>
                    <textarea name="hero_subtitle" class="form-control" rows="2">{{ settings.hero_subtitle }}</textarea>
                </div>
                <div class="col-span-12">
                    <label class="form-label">Mission statement</label>
                    <textarea name="mission_statement" class="form-control" rows="4">{{ settings.mission_statement }}</textarea>
                </div>
                <div class="col-span-6">
                    <label class="form-label">Contact phone</label>
                    <input name="contact_phone" class="form-control" value="{{ settings.contact_phone }}">
                </div>
                <div class="col-span-6">
                    <label class="form-label">Contact email</label>
                    <input type="email" name="contact_email" class="form-control" value="{{ settings.contact_email }}">
                </div>
                <div class="col-span-3">
                    <label class="form-label">Default currency</label>
                    <input name="default_currency" class="form-control" value="{{ settings.default_currency }}">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn-save btn-save--gold" type="submit">
                    <i class="fas fa-save"></i> Save settings
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
