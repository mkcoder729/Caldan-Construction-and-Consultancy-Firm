<div class="modal fade compassion-modal" id="inkindModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <button type="button" class="compassion-modal__close" data-bs-dismiss="modal" aria-label="Close">
        <i class="fas fa-xmark"></i>
      </button>

      <div class="modal-header compassion-modal__header">
        <div class="compassion-modal__eyebrow"><i class="fas fa-box-open"></i> Give Items</div>
        <h3 class="modal-title">Tell us what you have.</h3>
        <p class="compassion-modal__sub">We'll reply within one business day to arrange pickup, drop-off, or a logistics call.</p>
      </div>

      <div class="modal-body compassion-modal__body">
        <form id="inkindForm" method="post" action="{% url 'compassion:inkind_submit' %}" novalidate>
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="inkind-name">Full name</label>
              <input type="text" id="inkind-name" name="name" class="form-control" required maxlength="150" autocomplete="name">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inkind-email">Email</label>
              <input type="email" id="inkind-email" name="email" class="form-control" required autocomplete="email">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inkind-phone">Phone</label>
              <input type="tel" id="inkind-phone" name="phone" class="form-control" required maxlength="15" placeholder="0712 345 678" autocomplete="tel">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inkind-type">Type of item</label>
              <select id="inkind-type" name="item_type" class="form-select" required>
                <option value="FOOD">Food</option>
                <option value="CLOTHING">Clothing</option>
                <option value="MEDICAL">Medical supplies</option>
                <option value="OTHER">Other (describe below)</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="inkind-description">Description</label>
              <input type="text" id="inkind-description" name="item_description" class="form-control" required placeholder="e.g., maize flour, baby clothes, bandages">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inkind-quantity">Quantity <span class="text-muted">(approximate)</span></label>
              <input type="text" id="inkind-quantity" name="quantity_estimate" class="form-control" placeholder="e.g., 20kg, 50 items, 2 bags">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inkind-delivery">Delivery / pickup</label>
              <select id="inkind-delivery" name="delivery_mode" class="form-select">
                <option value="PICKUP">You'll pick it up</option>
                <option value="DROPOFF">We'll drop it off</option>
                <option value="ARRANGE" selected>Let's arrange together</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="inkind-date">Preferred date <span class="text-muted">(optional)</span></label>
              <input type="date" id="inkind-date" name="preferred_date" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label" for="inkind-address">Address <span class="text-muted">(if applicable)</span></label>
              <textarea id="inkind-address" name="address" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label" for="inkind-notes">Notes <span class="text-muted">(optional)</span></label>
              <textarea id="inkind-notes" name="notes" class="form-control" rows="3"></textarea>
            </div>
          </div>

          <div class="compassion-modal__submit">
            <button type="submit" class="btn-gold btn-lg w-100">
              <i class="fas fa-paper-plane"></i> Send pledge
            </button>
          </div>
        </form>

        <div class="compassion-modal__feedback" id="inkindFeedback" hidden></div>
      </div>
    </div>
  </div>
</div>
