version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8080"
    environment:
      - SECRET_KEY=django-insecure-test-key-do-not-use-in-production
      - DEBUG=true
      - DB_NAME=caldan_construction
      - DB_USER=root
      - DB_PASSWORD=
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=caldan_construction
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume: