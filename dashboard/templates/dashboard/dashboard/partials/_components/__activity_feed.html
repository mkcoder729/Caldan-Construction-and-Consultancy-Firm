<div class="activity-feed">
    <div class="activity-header">
        <div class="activity-title">
            <i class="fas fa-history"></i>
            <span>Recent Activity</span>
        </div>
        <a href="{% url 'dashboard:activity' %}" class="activity-view-all">
            View All <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <div class="activity-list">
        {% for activity in activities %}
            <div class="activity-item activity-{{ activity.color|default:'secondary' }}">
                <div class="activity-icon">
                    <i class="fas {{ activity.icon|default:'fa-clock' }}"></i>
                </div>
                <div class="activity-content">
                    <div class="activity-user">
                        <span class="activity-avatar">{{ activity.user_avatar|default:'U' }}</span>
                        <span class="activity-name">{{ activity.user|default:'System' }}</span>
                    </div>
                    <p class="activity-description">
                        <span class="activity-action">{{ activity.label }}</span>
                        {% if activity.details %}
                            <span class="activity-details">{{ activity.details|safe }}</span>
                        {% endif %}
                    </p>
                    <span class="activity-time">{{ activity.time_ago }}</span>
                </div>
            </div>
        {% empty %}
            <div class="activity-empty">
                <i class="fas fa-inbox"></i>
                <p>No recent activity</p>
            </div>
        {% endfor %}
    </div>
</div>

<style>

   ACTIVITY FEED - PREMIUM
   ================================================================ */

    transition: border-color var(--t-base) var(--ease-standard);

.activity-feed:hover {

}

.activity-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-subtle);

    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);

    gap: 8px;

}

}

.activity-view-all i {

.activity-item.activity-danger {

    font-size: 0.65rem;
    color: var(--text-tertiary);

.activity-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-tertiary);
}

.activity-empty i {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 12px;
    opacity: 0.3;
}

.activity-empty p {
    font-size: 0.9rem;
    margin: 0;

/* Responsive */

        padding: 16px;
    }

</style>
