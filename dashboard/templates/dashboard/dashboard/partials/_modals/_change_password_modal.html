<div class="modal" id="changePasswordModal" role="dialog" aria-modal="true" data-js-managed="1">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3>Change Password</h3>
            <button class="modal-close" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form class="modal-body" id="changePasswordForm"
              method="post" action="{% url 'dashboard:change_password' %}"
              autocomplete="off">
            {% csrf_token %}

            <div class="form-group">
                <label for="current_password">Current Password</label>
                <div class="form-input-wrapper">
                    <input type="password" name="current_password" id="current_password"
                           class="form-control" required placeholder="Enter current password"
                           autocomplete="current-password">
                    <button type="button" class="password-toggle" data-target="current_password"
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <div class="form-input-wrapper">
                    <input type="password" name="new_password" id="new_password"
                           class="form-control" required placeholder="Enter new password" minlength="8"
                           autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="new_password"
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="form-hint">Must be at least 8 characters with letters and numbers</span>
            </div>

            <div class="password-strength" id="passwordStrength">
                <div class="strength-bar">
                    <div class="strength-fill" style="width: 0%;"></div>
                </div>
                <span class="strength-text">Password strength: <span id="strengthLabel">None</span></span>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="form-input-wrapper">
                    <input type="password" name="confirm_password" id="confirm_password"
                           class="form-control" required placeholder="Confirm new password" minlength="8"
                           autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="confirm_password"
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="changePwCancel">Cancel</button>
                <button type="submit" class="btn btn-gold">Update Password</button>
            </div>
        </form>
    </div>
</div>

<style>
/* ================================================================
   CHANGE PASSWORD MODAL - PREMIUM
   ================================================================ */
#changePasswordModal .modal-body {
    text-align: left;
    padding: 24px;
}

#changePasswordModal .form-group {
    margin-bottom: 16px;
}

#changePasswordModal .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
}

#changePasswordModal .form-hint {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    margin-top: 4px;
    display: block;
}

#changePasswordModal .form-input-wrapper {
    position: relative;
}

#changePasswordModal .form-control {
    width: 100%;
    height: 44px;
    padding: 0 40px 0 14px;
    border: 1px solid var(--border-default);
    border-radius: var(--r-md);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color var(--t-fast) var(--ease-standard),
                box-shadow var(--t-fast) var(--ease-standard),
                background var(--t-fast) var(--ease-standard);
}

#changePasswordModal .form-control:focus {
    outline: none;
    border-color: var(--brand-gold);
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    background: var(--bg-card);
}

#changePasswordModal .form-control::placeholder {
    color: var(--text-tertiary);
}

#changePasswordModal .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 4px;
    transition: color var(--t-fast) var(--ease-standard);
}

#changePasswordModal .password-toggle:hover {
    color: var(--text-secondary);
}

#changePasswordModal .password-strength {
    margin-bottom: 16px;
}

#changePasswordModal .strength-bar {
    height: 4px;
    background: var(--bg-secondary);
    border-radius: var(--r-pill);
    overflow: hidden;
}

#changePasswordModal .strength-fill {
    height: 100%;
    border-radius: var(--r-pill);
    transition: width var(--t-base) var(--ease-standard),
                background var(--t-base) var(--ease-standard);
}

#changePasswordModal .strength-text {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    display: block;
    margin-top: 4px;
}

#changePasswordModal .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    justify-content: flex-end;
}

/* Responsive */
@media (max-width: 640px) {
    #changePasswordModal .modal-body {
        padding: 16px;
    }

    #changePasswordModal .modal-actions {
        flex-direction: column;
    }

    #changePasswordModal .modal-actions .btn {
        width: 100%;
        justify-content: center;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('changePasswordModal');
    var form = document.getElementById('changePasswordForm');
    var newPassword = document.getElementById('new_password');
    var strengthFill = document.querySelector('#passwordStrength .strength-fill');
    var strengthLabel = document.getElementById('strengthLabel');

    // Password strength checker
    if (newPassword) {
        newPassword.addEventListener('input', function() {
            var value = this.value;
            var strength = 0;

            if (value.length >= 8) strength += 25;
            if (/[a-z]/.test(value) && /[A-Z]/.test(value)) strength += 25;
            if (/\d/.test(value)) strength += 25;
            if (/[^a-zA-Z0-9]/.test(value)) strength += 25;

            strengthFill.style.width = strength + '%';

            var label = 'Weak';
            var color = '#E74C3C';
            if (strength >= 75) { label = 'Strong'; color = '#27AE60'; }
            else if (strength >= 50) { label = 'Good'; color = '#F39C12'; }
            else if (strength >= 25) { label = 'Weak'; color = '#E74C3C'; }
            else { label = 'None'; color = '#95A5A6'; }

            strengthLabel.textContent = label;
            strengthFill.style.background = color;
        });
    }

    // Password toggle
    document.querySelectorAll('#changePasswordModal .password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var target = document.getElementById(this.dataset.target);
            if (target) {
                var type = target.type === 'password' ? 'text' : 'password';
                target.type = type;
                this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            }
        });
    });

    // Form validation
    if (form) {
        form.addEventListener('submit', function(e) {
            var current = document.getElementById('current_password');
            var newPw = document.getElementById('new_password');
            var confirm = document.getElementById('confirm_password');

            if (!current.value) {
                e.preventDefault();
                showToast('error', 'Error', 'Please enter your current password.');
                current.focus();
                return;
            }

            if (newPw.value.length < 8) {
                e.preventDefault();
                showToast('error', 'Error', 'Password must be at least 8 characters.');
                newPw.focus();
                return;
            }

            if (newPw.value !== confirm.value) {
                e.preventDefault();
                showToast('error', 'Error', 'Passwords do not match.');
                confirm.focus();
                return;
            }
        });
    }

    // Open/Close
    window.openChangePassword = function() {
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        setTimeout(function() {
            document.getElementById('current_password')?.focus();
        }, 100);
    };

    function closeChangePassword() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        form.reset();
        strengthFill.style.width = '0%';
        strengthLabel.textContent = 'None';
    }

    document.querySelector('#changePasswordModal .modal-overlay')?.addEventListener('click', closeChangePassword);
    document.querySelector('#changePasswordModal .modal-close')?.addEventListener('click', closeChangePassword);
    document.getElementById('changePwCancel')?.addEventListener('click', closeChangePassword);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('open')) {
            closeChangePassword();
        }
    });
});
</script>
