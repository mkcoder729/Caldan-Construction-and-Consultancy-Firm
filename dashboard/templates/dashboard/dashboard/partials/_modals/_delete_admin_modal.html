<div class="modal" id="deleteAdminModal" role="dialog" aria-modal="true" data-js-managed="1">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3>Delete Admin</h3>
            <button class="modal-close" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="confirm-icon" style="color:var(--sem-danger);background:rgba(185,52,43,0.12);">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <p class="confirm-message" id="deleteAdminMessage">
                Are you sure you want to delete this admin? This action cannot be undone.
            </p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="deleteAdminCancel">Cancel</button>
                <button class="btn btn-danger" id="deleteAdminConfirm">Delete Admin</button>
            </div>
        </div>
    </div>
</div>

<style>
/* Reuses confirm modal styles from _confirm_modal.html */
/* The modal class is already defined globally */
#deleteAdminModal .modal-content {
    max-width: 420px;
}

#deleteAdminModal .confirm-icon {
    width: 56px;
    height: 56px;
    border-radius: var(--r-pill);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 16px;
}

#deleteAdminModal .confirm-message {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin: 0 0 24px;
    line-height: 1.5;
    text-align: center;
}

#deleteAdminModal .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}

@media (max-width: 640px) {
    #deleteAdminModal .modal-actions {
        flex-direction: column;
    }
    #deleteAdminModal .modal-actions .btn {
        width: 100%;
        justify-content: center;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('deleteAdminModal');
    var adminId = null;
    var onSuccess = null;

    window.openDeleteAdminModal = function(id, callback) {
        adminId = id;
        onSuccess = callback;
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    };

    function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        adminId = null;
    }

    document.querySelector('#deleteAdminModal .modal-overlay')?.addEventListener('click', closeModal);
    document.querySelector('#deleteAdminModal .modal-close')?.addEventListener('click', closeModal);
    document.getElementById('deleteAdminCancel')?.addEventListener('click', closeModal);

    document.getElementById('deleteAdminConfirm')?.addEventListener('click', function() {
        if (adminId && onSuccess) {
            onSuccess(adminId);
        }
        closeModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('open')) {
            closeModal();
        }
    });
});
</script>
